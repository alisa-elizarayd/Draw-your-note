name: Validate Draw your notes PWA (GitHub Pages from main root)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check deployable HTML, service worker, manifest and icons
        run: |
          python3 - <<'PY'
          import json, re, subprocess, tempfile, struct
          from pathlib import Path
          r = Path('.')
          html = (r / 'index.html').read_text(encoding='utf-8')
          assert html.lstrip().lower().startswith('<!doctype html>')
          assert 'serviceWorker.register' in html
          manifest = json.loads((r / 'manifest.webmanifest').read_text())
          assert manifest['display'] == 'standalone'
          assert manifest['start_url'] == './'
          for icon in ('icon-192.png','icon-512.png','icon-512-maskable.png','apple-touch-icon.png'):
              data = (r / icon).read_bytes()
              assert data[:8] == bytes.fromhex('89504e470d0a1a0a'), icon
              width, height = struct.unpack('>II', data[16:24])
              if icon == 'icon-192.png': assert (width,height)==(192,192)
              elif icon == 'apple-touch-icon.png': assert (width,height)==(180,180)
              else: assert (width,height)==(512,512)
          for n, script in enumerate(re.findall(r'<script[^>]*>(.*?)</script>',html,re.S)):
              with tempfile.NamedTemporaryFile(mode='w',suffix='.js') as temp:
                  temp.write(script);temp.flush()
                  subprocess.run(['node','--check',temp.name], check=True)
          subprocess.run(['node','--check','sw.js'],check=True)
          print('PWA source checks passed; main/ root is the deploy source.')
          PY
